<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="1154" viewBox="0 0 1408 1154" role="img" aria-labelledby="title description">
<title id="title">Dispatch on AWS: managed-domain architecture</title>
<desc id="description">Users reach CloudFront. Static content is served from private S3 with OAC. API traffic enters a private ALB through a CloudFront VPC origin and reaches the backend. The backend and launcher are Fargate services in public subnets with restricted ingress. The launcher creates per-conversation Fargate workers in a separate cluster. Controllers and workers connect to private Aurora PostgreSQL; the backend stores artifacts in versioned S3. Default egress uses public task IPv4 rather than a NAT gateway. Private control, callbacks and operator flows are omitted.</desc>
